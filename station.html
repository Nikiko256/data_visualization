<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Station Details</title>
  <link rel="stylesheet" href="css/main.css">

  <script>
    (function () {
      const saved = localStorage.getItem("theme");
      document.documentElement.dataset.theme = saved === "light" ? "light" : "dark";
    })();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
  <script src="js/graph.js?v=4" defer></script>
  <script src="js/station.js?v=4" defer></script>
  <script src="js/theme.js?v=4" defer></script>
</head>
<body>
  <div id="pageLoader" class="page-loader" aria-hidden="false">
    <div class="page-loader__card">
      <div class="page-loader__spinner"></div>
      <div class="page-loader__text">Loading station data...</div>
    </div>
  </div>

  <div class="container">
    <header class="topbar">
      <div></div>
      <h1 id="stationTitle">Μετεωρολογικός Σταθμός:</h1>
      <button class="btn" id="themeToggle" type="button" aria-label="Toggle theme">🌙</button>
    </header>

    <section id="nodeControlsSection" class="controls">
      <label for="nodeSelect">Επιλέξτε κόμβο:</label>
      <div>
        <select id="nodeSelect" class="time-select">
          <option value="">Επιλέξτε κόμβο:</option>
        </select>
        <button id = "exportCsvBtn" class ="btn" type="button">
          Export CSV
        </button>
      </div>
    </section>

    <section id="nodeDataSection" class="charts-container"></section>
  </div>

  <div id="chartModal" class="modal" aria-hidden="true">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-label="Expanded chart">
      <div class="modal-body"></div>
      <div class="modal-footer">
        <button class="btn" type="button" data-close-modal>Close</button>
      </div>
    </div>
  </div>
</body>
</html>
