<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stations by Niki & Andreas</title>
  <script>
    (function () {
    const saved = localStorage.getItem("theme");
    document.documentElement.dataset.theme = saved === "light" ? "light" : "dark";
  })();
  </script>

  <link rel="stylesheet" href="css/main.css">
  
</head>
<body>
  <div id="pageLoader" class="page-loader" aria-hidden="false">
  <div class="page-loader__card">
      <div class="page-loader__spinner"></div>
      <div class="page-loader__text">Loading stations...</div>
    </div>
  </div>
  <div class="container">
    <header class="topbar">
    <div></div>
    <h1>Διαθέσιμοι Σταθμοί</h1>
    <button class="btn" id="themeToggle" type="button" aria-label="Toggle theme">🌙</button>
    </header>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search stations...">
    </div>
    <ul class="stations-list" id="stationsList">
      <!-- Station items will be injected here -->
    </ul>
  </div>

  <script src="js/main.js?v=4"></script>
  <script src="js/theme.js?v=4" defer></script>

</body>
</html>
